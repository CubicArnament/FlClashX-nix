name: cleanup-attestations

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete expired attestation releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date --utc --date='7 days ago' +%s)
          gh release list --limit 100 --json tagName,createdAt | jq -r '.[] | select(.tagName | startswith("attestation-")) | [.tagName, .createdAt] | @tsv' |
            while IFS=$'\t' read -r tag created; do
              if [ "$(date --utc --date="$created" +%s)" -lt "$cutoff" ]; then
                gh release delete "$tag" --yes --cleanup-tag
              fi
            done
