name: sync-upstream

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Merge and prune upstream
        run: |
          git config user.name "flclashx-nix bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/pluralplay/FlClashX.git
          git fetch upstream main
          before=$(git rev-parse HEAD)
          git merge --no-ff --no-edit upstream/main

          # This fork intentionally supports Linux and Android only.
          git rm -r --ignore-unmatch \
            windows macos ios services/helper plugins/proxy plugins/window_ext

          if [ "$before" = "$(git rev-parse HEAD)" ]; then
            exit 0
          fi

          git commit --amend --no-edit
          git push origin HEAD:main
