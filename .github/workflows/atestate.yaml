name: dependency-attestation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Verify dependency attestation
        run: nix flake check --no-build

      - name: Generate dependency attestation
        run: nix build .#dependency-attestation --out-link attestation-result

      - name: Upload dependency attestation
        uses: actions/upload-artifact@v4
        with:
          name: dependency-attestation-${{ github.sha }}
          path: attestation-result/attestation.json
          retention-days: 7

      - name: Publish temporary attestation release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="attestation-${GITHUB_SHA}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "Dependency attestation ${GITHUB_SHA::12}" \
              --notes "Automated Nix dependency attestation. This technical release expires after seven days; it contains no application binaries."
          fi
          gh release upload "$tag" attestation-result/attestation.json --clobber
