name: dependency-attestation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Verify dependency attestation
        run: nix flake check --no-build

      - name: Generate dependency attestation
        run: nix build .#dependency-attestation --out-link attestation-result

      - name: Upload dependency attestation
        uses: actions/upload-artifact@v4
        with:
          name: dependency-attestation-${{ github.sha }}
          path: attestation-result/attestation.json
          retention-days: 7

      - name: Publish temporary attestation release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="attestation-${GITHUB_SHA}"
          gh release list --limit 100 --json tagName --jq '.[].tagName | select(startswith("attestation-"))' |
            while IFS= read -r old_tag; do
              gh release delete "$old_tag" --yes --cleanup-tag
            done
          gh release create "$tag" attestation-result/attestation.json \
            --target "$GITHUB_SHA" \
            --title "Dependency attestation ${GITHUB_SHA::12}" \
            --notes-file attestation-result/release-notes.md
